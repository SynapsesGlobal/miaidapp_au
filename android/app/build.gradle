android {
    namespace 'com.em.bright.miaid'
    compileSdkVersion 36
    ndkVersion "27.0.12077973"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false // Add this line
    }

    signingConfigs {
        debug {
            storeFile file(playstoreKeystoreProperties['storeFile'])
            storePassword playstoreKeystoreProperties['storePassword']
            keyAlias playstoreKeystoreProperties['keyAlias']
            keyPassword playstoreKeystoreProperties['storePassword']
        }

        playstore {
            storeFile file(playstoreKeystoreProperties['storeFile'])
            storePassword playstoreKeystoreProperties['storePassword']
            keyAlias playstoreKeystoreProperties['keyAlias']
            keyPassword playstoreKeystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId "com.em.bright.miaid"
        minSdkVersion 23 // flutter_zxing 2.2+（16KB 支持）要求 minSdk 23
        targetSdkVersion 36
        versionCode 106
        versionName flutterVersionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions "app"
    productFlavors {
        google_sandbox {
            dimension "app"
            applicationId "com.em.bright.miaid.test"
            resValue "string", "app_name", "MiAid(Test)"
            versionCode flutterVersionCode.toInteger()
            versionName flutterVersionName
        }

        google_prod {
            dimension "app"
            applicationId "com.em.bright.miaid"
            resValue "string", "app_name", "MiAid"
            versionCode flutterVersionCode.toInteger()
            versionName flutterVersionName
        }
    }


    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // 仅 debug 构建额外包含 x86_64，便于在 x86_64 模拟器上运行；
            // release 仍只使用 defaultConfig 的 arm64-v8a，不影响生产包。
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
            // productFlavors.google_prod.signingConfig signingConfigs.playstore
            shrinkResources false // Add this line
            minifyEnabled true// Add this line
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            // productFlavors.google_sandbox.signingConfig signingConfigs.debug
//            productFlavors.google_sandbox.signingConfig signingConfigs.debug
            signingConfig signingConfigs.playstore
            shrinkResources false // Add this line
            minifyEnabled false// Add this line
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
            // 排除 App 未使用的 Agora 可选扩展库（约 43MB/ABI）。
            // 引擎只在调用对应功能 API（enableExtension/美颜/虚拟背景等）时才加载这些库，
            // 基础音视频通话不依赖它们；若未来用到某个功能，从这里删掉对应一行即可。
            excludes += [
                '**/libagora_ai_echo_cancellation_extension.so',    // AI 回声消除（标准 AEC 在核心库内）
                '**/libagora_ai_echo_cancellation_ll_extension.so',
                '**/libagora_ai_noise_suppression_extension.so',    // AI 降噪
                '**/libagora_ai_noise_suppression_ll_extension.so',
                '**/libagora_audio_beauty_extension.so',            // 美声
                '**/libagora_clear_vision_extension.so',            // 视频增强/美颜/暗光
                '**/libagora_content_inspect_extension.so',         // 内容审核
                '**/libagora_face_capture_extension.so',            // 面部捕捉
                '**/libagora_face_detection_extension.so',          // 人脸检测
                '**/libagora_lip_sync_extension.so',                // 唇形同步
                '**/libagora_screen_capture_extension.so',          // 屏幕共享
                '**/libagora_segmentation_extension.so',            // 虚拟背景
                '**/libagora_spatial_audio_extension.so',           // 空间音频
                '**/libagora_video_av1_encoder_extension.so',       // AV1 编码
                '**/libagora_video_quality_analyzer_extension.so',  // 视频质量分析
                '**/libagora_ffmpeg.so',                            // 全格式媒体解码（audioMixing/媒体播放器用，通话不需要）
            ]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation platform('com.google.firebase:firebase-bom:29.0.0')
    implementation 'androidx.emoji2:emoji2:1.3.0'

}

