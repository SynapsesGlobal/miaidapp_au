android {
    namespace 'com.em.bright.miaid'
    compileSdkVersion 35

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false // Add this line
    }

    signingConfigs {
        debug {
            storeFile file(playstoreKeystoreProperties['storeFile'])
            storePassword playstoreKeystoreProperties['storePassword']
            keyAlias playstoreKeystoreProperties['keyAlias']
            keyPassword playstoreKeystoreProperties['storePassword']
        }

        playstore {
            storeFile file(playstoreKeystoreProperties['storeFile'])
            storePassword playstoreKeystoreProperties['storePassword']
            keyAlias playstoreKeystoreProperties['keyAlias']
            keyPassword playstoreKeystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId "com.em.bright.miaid"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 106
        versionName flutterVersionName
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions "app"
    productFlavors {
        google_sandbox {
            dimension "app"
            applicationId "com.em.bright.miaid"
            versionCode flutterVersionCode.toInteger()
            versionName flutterVersionName
        }

        google_prod {
            dimension "app"
            applicationId "com.em.bright.miaid"
            versionCode flutterVersionCode.toInteger()
            versionName flutterVersionName
        }
    }


    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // 仅 debug 构建额外包含 x86_64，便于在 x86_64 模拟器上运行；
            // release 仍只使用 defaultConfig 的 arm64-v8a，不影响生产包。
            ndk {
                abiFilters 'arm64-v8a', 'x86_64'
            }
            // productFlavors.google_prod.signingConfig signingConfigs.playstore
            shrinkResources false // Add this line
            minifyEnabled true// Add this line
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            // productFlavors.google_sandbox.signingConfig signingConfigs.debug
//            productFlavors.google_sandbox.signingConfig signingConfigs.debug
            signingConfig signingConfigs.playstore
            shrinkResources false // Add this line
            minifyEnabled false// Add this line
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation platform('com.google.firebase:firebase-bom:29.0.0')
    implementation 'androidx.emoji2:emoji2:1.3.0'

}

