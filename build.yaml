targets:
  $default:
    sources:
      - lib/**
      - $package$
    builders:
      # MobX store 全部位于 lib/store/，限定扫描范围，
      # 避免 mobx 解析生成文件/无关文件时卡死或触发 analyzer 崩溃
      mobx_codegen:mobx_generator:
        generate_for:
          include:
            - lib/store/**
      swagger_dart_code_generator:
        options:
          with_base_url: true
          with_converter: true
          use_required_attribute_for_headers: false
          ignore_headers: false
          use_default_null_for_lists: false
          build_only_models: false
          use_path_for_request_names: false
          include_if_null: false
          input_folder: "lib/"
          output_folder: "lib/generated_api_code/"
          enums_case_sensitive: true
          default_values_map:
          response_override_value_map: